# Stack definition for local runs.
#
# The deployed copy of this stack lives in the deployment repository `dockops`
# under apps/internal/formations-timer/compose.yaml and is rolled out by
# Dockhand. Changes that affect production belong there, not here.
#
# Releases trigger a redeploy through the webhook stored as the repository
# secrets DEPLOY_WEBHOOK_URL and DEPLOY_WEBHOOK_SECRET. That webhook needs
# force redeploy enabled; otherwise Dockhand sees an unchanged repository,
# skips the deployment and still reports success.
#
# Variables live in .env.example — copy them into a .env next to this file for
# a local docker compose up.
name: formationstimer

services:
  formationstimer:
    image: ${FORMATIONSTIMER_IMAGE}:${FORMATIONSTIMER_TAG}
    container_name: ${FORMATIONSTIMER_CONTAINER_NAME}
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    # Static files only, so nothing needs a writable layer. nginx keeps its
    # temp files and pid in tmpfs.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

    environment:
      TZ: ${TZ}

    networks:
      - proxy

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      # WUD — updates come from the GitHub Actions webhook, so this container is
      # only displayed, not watched. Letting both rewrite the same tag would
      # mean two mechanisms racing over one container.
      wud.watch: "false"
      wud.display.name: "Formations Timer"
      wud.display.icon: "mdi:timer-outline"

      # Traefik
      traefik.enable: "true"
      traefik.scope: "proxy"
      traefik.docker.network: "${FORMATIONSTIMER_NETWORK}"

      # Router
      traefik.http.routers.formationstimer.rule: "Host(`${FORMATIONSTIMER_HOST}`)"
      traefik.http.routers.formationstimer.entrypoints: "websecure"
      traefik.http.routers.formationstimer.service: "formationstimer"
      traefik.http.routers.formationstimer.tls: "true"

      # Service
      traefik.http.services.formationstimer.loadbalancer.server.port: "${FORMATIONSTIMER_INTERNAL_PORT}"

networks:
  proxy:
    external: true
    name: ${FORMATIONSTIMER_NETWORK}
