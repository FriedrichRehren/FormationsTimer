server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Note: no "types { … }" block here. At server level it would replace the
    # whole inherited MIME table from http{}, and everything — including
    # index.html and sw.js — would go out as application/octet-stream. Combined
    # with nosniff that means a blank page and a service worker that refuses to
    # register. The one missing type is handled per location below.

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    location = /healthz {
        access_log off;
        include /etc/nginx/headers.conf;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The service worker must never come from a stale cache — that is exactly
    # what strands installed clients on an old version.
    location = /sw.js {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # .webmanifest is not in nginx's MIME table.
    location = /manifest.webmanifest {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
    }

    location / {
        include /etc/nginx/headers.conf;

        # No asset here carries a content hash in its file name, so nothing may
        # be cached without revalidation: a stale app.js from the HTTP cache
        # would also poison the service worker's precache. "no-cache" still
        # allows storing the response — with ETags a repeat visit costs one 304
        # per file, and after the first visit the service worker answers from
        # its own cache anyway. Do not "optimise" this into a long max-age.
        add_header Cache-Control "no-cache" always;

        try_files $uri $uri/ =404;
    }
}
